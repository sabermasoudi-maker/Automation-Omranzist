<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اتوماسیون اداری عمران زیست</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1f2933;--mut:#6b7280;--line:#e3e6ea;--pri:#1f5f8b;--pri2:#e8f1f8;--ok:#1e7a46;--okb:#e6f4ec;--warn:#9a6700;--warnb:#fdf3dc;--bad:#b42318;--badb:#fdecea}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,"Vazir",Tahoma,"Segoe UI",sans-serif;font-size:14px;line-height:1.7}
a{color:var(--pri);text-decoration:none}
button,input,select,textarea{font:inherit}
input,select,textarea{border:1px solid #cfd4da;border-radius:6px;padding:6px 8px;background:#fff;width:100%}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:2px}
.btn{border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:6px;padding:6px 14px;cursor:pointer;white-space:nowrap}
.btn.l{background:#fff;color:var(--pri)}
.btn.ok{background:var(--ok);border-color:var(--ok)}
.btn.bad{background:var(--bad);border-color:var(--bad)}
.btn.sm{padding:2px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
#app{display:none;min-height:100vh}
header{background:#17344d;color:#fff;display:flex;align-items:center;gap:16px;padding:8px 18px}
header b{font-size:15px}header .sp{flex:1}header a{color:#cfe3f3;cursor:pointer}
.wrap{display:flex}
nav{width:200px;background:#fff;border-left:1px solid var(--line);min-height:calc(100vh - 44px);padding:10px 0}
nav a{display:flex;justify-content:space-between;padding:8px 18px;color:var(--ink)}
nav a.on{background:var(--pri2);color:var(--pri);font-weight:bold;border-right:3px solid var(--pri)}
nav .badge{background:var(--bad);color:#fff;border-radius:10px;padding:0 7px;font-size:12px}
main{flex:1;padding:18px 22px;min-width:0}
h1{font-size:18px;margin:0 0 14px}h2{font-size:15px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 14px}
.full{grid-column:1/-1}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#f8f9fb;font-weight:600;color:#444;font-size:13px;white-space:nowrap}
tr.cl{cursor:pointer}tr.cl:hover td{background:#f5f9fc}
tr.late td{background:var(--badb)}
.tag{display:inline-block;border-radius:10px;padding:0 8px;font-size:12px;background:#eef0f3;color:#444;white-space:nowrap}
.tag.ok{background:var(--okb);color:var(--ok)}.tag.warn{background:var(--warnb);color:var(--warn)}.tag.bad{background:var(--badb);color:var(--bad)}.tag.pri{background:var(--pri2);color:var(--pri)}
.row{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.row>div{min-width:130px}
.mut{color:var(--mut);font-size:12.5px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.tabs a{padding:6px 14px;border-radius:6px 6px 0 0;color:var(--mut);cursor:pointer}
.tabs a.on{background:#fff;border:1px solid var(--line);border-bottom-color:#fff;margin-bottom:-1px;color:var(--ink);font-weight:bold}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 12px}.kv div:nth-child(odd){color:var(--mut)}
.users{max-height:190px;overflow:auto;border:1px solid #cfd4da;border-radius:6px;padding:4px 8px;background:#fff}
.users label{display:flex;gap:6px;align-items:center;color:var(--ink);font-size:13.5px;margin:2px 0;cursor:pointer}
.users input{width:auto}
.chain{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chain .st{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff;min-width:150px}
.chain .st.approved{border-color:var(--ok);background:var(--okb)}.chain .st.pending{border-color:var(--warn);background:var(--warnb)}
.chain .st.rejected,.chain .st.returned{border-color:var(--bad);background:var(--badb)}.chain .st.skipped{opacity:.5}
.bar{height:8px;background:var(--pri);border-radius:4px}
#msg{position:fixed;bottom:20px;left:20px;background:#17344d;color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:9;max-width:420px}
#msg.err{background:var(--bad)}
#login{display:none;max-width:340px;margin:12vh auto}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:8}
.modal .card{width:min(520px,94vw);max-height:90vh;overflow:auto}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
.print-only{display:none}
nav .grp{padding:10px 18px 2px;font-weight:bold;color:#17344d;font-size:13px;border-top:1px solid var(--line);margin-top:6px}
nav .grp:first-child{border-top:none;margin-top:0}
nav a.sub{padding:5px 32px 5px 18px;font-size:13.5px}
nav a.main{font-weight:bold;color:#17344d;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
nav a.act{color:var(--pri);cursor:pointer}
nav hr{border:none;border-top:1px solid var(--line);margin:8px 0}
.org>div{display:flex;gap:10px;align-items:baseline;padding:3px 0;border-bottom:1px dashed var(--line)}
.org span{color:var(--mut);min-width:120px;font-size:13px}.org .o1{padding-right:22px}.org .o2{padding-right:44px}.org .o3{padding-right:66px}
.org .o3 span::before{content:'└ ';color:var(--mut)}
.crumb{color:var(--mut);font-size:12.5px;margin-bottom:4px}
/* فرم درخواست کالا — مطابق فرم کاغذی */
.sheet{background:#fff;color:#111;margin-bottom:14px}
.sheet table{width:100%;border-collapse:collapse;border:2px solid #222;background:#fff;margin-top:-2px}
.sheet td,.sheet th{border:1.5px solid #333;padding:6px 8px;vertical-align:top;text-align:right;background:#fff;color:#111}
.sheet th{font-size:13.5px;text-align:center}
.sheet label{display:inline;color:#111;font-weight:bold;font-size:13.5px;margin:0 0 0 6px}
.sheet .hd{display:flex;align-items:center;gap:14px;min-height:80px}
.sheet .logo{height:72px}
.sheet .co{font-size:19px;font-weight:bold}.sheet .ttl{font-size:17px;font-weight:bold;margin-top:8px}
.sheet .meta{width:27%}.sheet .meta div{margin:8px 0}
.sheet .w35{width:35%}
.sheet .items td{height:34px}.sheet .c{text-align:center;width:44px}
.sheet .sign{margin-top:12px}.sheet .sign td{height:86px;width:50%}
.sheet input,.sheet select,.sheet textarea{border:1px dashed #b9c0c8;background:#fbfcfd;padding:3px 6px}
.sheet .items input{border-color:transparent;background:transparent}.sheet .items input:focus{border-color:#b9c0c8;background:#fff}
.sheet .sg{font-size:13px;margin-top:4px}
@media print{header,nav,.noprint,.btn{display:none!important}main{padding:0}.card{border:none;padding:0}.print-only{display:block}body{background:#fff}
 @page{size:A4;margin:12mm}.sheet td,.sheet th{-webkit-print-color-adjust:exact;print-color-adjust:exact}.sheet input,.sheet select,.sheet textarea{border:none}}
#menuBtn,#navbg{display:none}
/* موبایل: منو به‌صورت کشو، جدول‌ها با اسکرول افقی، فرم خرید ستونی */
@media screen and (max-width:760px){
 body{font-size:15px}
 header{position:sticky;top:0;z-index:7;gap:10px;padding:8px 10px;flex-wrap:wrap}
 header b{font-size:13.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}header .sp{display:none}
 #meName{font-size:12px;width:100%;order:9;color:#cfe3f3}
 #menuBtn{display:inline-flex;align-items:center;gap:4px;background:none;border:1px solid #4b6a85;color:#fff;border-radius:6px;font-size:20px;padding:2px 10px;cursor:pointer}
 .wrap{display:block}
 nav{position:fixed;top:0;right:0;bottom:0;width:270px;max-width:82vw;z-index:9;overflow-y:auto;transform:translateX(105%);transition:transform .2s;box-shadow:-4px 0 18px rgba(0,0,0,.2);min-height:0}
 body.navopen nav{transform:none}
 body.navopen #navbg{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:8}
 nav a{padding:11px 18px}nav a.sub{padding:10px 32px 10px 18px}
 main{padding:10px}
 h1{font-size:16.5px}
 .card{padding:12px}
 input,select,textarea{font-size:16px}
 .btn{padding:9px 14px}.btn.sm{padding:5px 12px}
 table{display:block;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
 td{white-space:normal;min-width:70px}
 .kv{grid-template-columns:110px 1fr}
 .row>div{min-width:0;flex:1 1 140px}
 .chain .st{min-width:0}
 .modal .card{width:96vw}
 #msg{left:10px;right:10px;bottom:10px;max-width:none}
 .sheet table{display:table;white-space:normal;margin-top:6px;border-width:1.5px}
 .sheet td,.sheet th{display:block;width:auto!important;border:none;border-bottom:1px solid #ccd}
 .sheet .hd{min-height:0}.sheet .logo{height:48px}.sheet .co{font-size:16px}.sheet .ttl{font-size:15px;margin-top:4px}
 .sheet .meta div{margin:2px 0}
 .sheet .items thead{display:none}
 .sheet .items tr{display:grid;grid-template-columns:1fr 1fr;border-bottom:2px solid #222;padding:4px 0}
 .sheet .items td{height:auto;border:none;padding:3px 8px}
 .sheet .items td.c{grid-column:1/-1;text-align:right;font-weight:bold;background:#f3f5f8}
 .sheet .items td.c::before{content:'ردیف '}
 .sheet .items td[data-l]::before{content:attr(data-l);display:block;font-size:12px;color:#666}
 .sheet .items td[data-k=title],.sheet .items td[data-k=spec],.sheet .items td[data-k=note]{grid-column:1/-1}
 .sheet .items input{border:1px dashed #b9c0c8;background:#fbfcfd}
 .sheet .sign td{height:auto;min-height:60px}
}
</style>
</head>
<body>
<div id="login" class="card">
  <h1 id="lgTitle">ورود به سامانه</h1>
  <div style="margin-bottom:8px"><label>نام کاربری</label><input id="lgU" autocomplete="username"></div>
  <div style="margin-bottom:12px"><label>رمز عبور</label><input id="lgP" type="password" autocomplete="current-password"></div>
  <button class="btn" onclick="doLogin()" style="width:100%">ورود</button>
</div>
<div id="app">
  <header><button id="menuBtn" onclick="toggleNav()" aria-label="منو">☰<span class="badge" id="cnt2" style="display:none"></span></button><b id="coName">اتوماسیون اداری</b><span class="sp"></span><span id="meName"></span>
    <a onclick="pwModal()">تغییر رمز</a><a onclick="logout()">خروج</a></header>
  <div class="wrap"><nav id="nav"></nav><div id="navbg" onclick="toggleNav(0)"></div><main id="view"></main></div>
</div>
<div id="msg"></div>
<script>
// ---------------------------------------------------------------- ابزارها
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fa=s=>String(s??'').replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const en=s=>String(s??'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const money=n=>n==null||n===''?'':fa(Number(n).toLocaleString('en-US'));
function g2j(gy,gm,gd){const g=[0,31,59,90,120,151,181,212,243,273,304,334];const gy2=gm>2?gy+1:gy;let days=355666+365*gy+~~((gy2+3)/4)-~~((gy2+99)/100)+~~((gy2+399)/400)+gd+g[gm-1];let jy=-1595+33*~~(days/12053);days%=12053;jy+=4*~~(days/1461);days%=1461;if(days>365){jy+=~~((days-1)/365);days=(days-1)%365}const jm=days<186?1+~~(days/31):7+~~((days-186)/30);const jd=1+(days<186?days%31:(days-186)%30);return[jy,jm,jd]}
function j2g(jy,jm,jd){jy+=1595;let days=-355668+365*jy+~~(jy/33)*8+~~(((jy%33)+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);let gy=400*~~(days/146097);days%=146097;if(days>36524){gy+=100*~~(--days/36524);days%=36524;if(days>=365)days++}gy+=4*~~(days/1461);days%=1461;if(days>365){gy+=~~((days-1)/365);days=(days-1)%365}let gd=days+1;const sa=[0,31,(gy%4==0&&gy%100!=0)||gy%400==0?29:28,31,30,31,30,31,31,30,31,30,31];let gm;for(gm=0;gm<13&&gd>sa[gm];gm++)gd-=sa[gm];return[gy,gm,gd]}
const p2=n=>String(n).padStart(2,'0');
function jd(iso,time){if(!iso)return'';const[y,m,d]=iso.slice(0,10).split('-').map(Number);const j=g2j(y,m,d);return fa(j[0]+'/'+p2(j[1])+'/'+p2(j[2])+(time&&iso.length>10?' '+iso.slice(11,16):''))}
function toIso(js){js=en(js).trim();if(!js)return'';const m=js.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);if(!m)throw new Error('تاریخ «'+fa(js)+'» نامعتبر است؛ مثل ۱۴۰۵/۰۷/۱۵ وارد کنید');const g=j2g(+m[1],+m[2],+m[3]);return g[0]+'-'+p2(g[1])+'-'+p2(g[2])}
function todayJ(add=0){const d=new Date();d.setDate(d.getDate()+add);return jd(d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()))}
function flash(t,err){const m=$('#msg');m.textContent=t;m.className=err?'err':'';m.style.display='block';clearTimeout(flash.t);flash.t=setTimeout(()=>m.style.display='none',err?6000:2500)}
async function api(method,url,body,raw){
  const o={method,headers:{}};
  if(raw){o.body=raw.data;o.headers['X-Filename']=encodeURIComponent(raw.name);if(raw.kind)o.headers['X-Kind']=encodeURIComponent(raw.kind);o.headers['Content-Type']='application/octet-stream'}
  else if(body!==undefined){o.body=JSON.stringify(body);o.headers['Content-Type']='application/json'}
  const r=await fetch(url,o);let j={};try{j=await r.json()}catch(e){}
  if(r.status==401&&url!='/api/login'){showLogin();throw new Error(j.error||'ابتدا وارد شوید')}
  if(!r.ok)throw new Error(j.error||'خطا');return j}
async function run(fn){try{await fn()}catch(e){flash(e.message,1)}}
const val=id=>($('#'+id)||{}).value||'';
const opts=(arr,sel,empty)=>(empty!==undefined?`<option value="">${esc(empty)}</option>`:'')+arr.map(([v,t])=>`<option value="${esc(v)}" ${String(v)==String(sel??'')?'selected':''}>${esc(t)}</option>`).join('');
let M=null;
const uname=id=>(M.users.find(u=>u.id==id)||{}).full_name||'';
const REF_ST={new:['دیده نشده','bad'],seen:['دیده شد','warn'],doing:['در حال اقدام','pri'],done:['انجام شد','ok'],returned:['برگشت','bad'],forwarded:['ارجاع شد','ok'],closed:['بسته','']};
const L_ST={open:['جاری','warn'],archived:['بایگانی','ok']};
const R_ST={pending:['در انتظار تأیید','warn'],returned:['برگشت برای اصلاح','bad'],approved:['تأیید شد — منتظر پرداخت','pri'],paid:['پرداخت شد — بدون سند سپیدار','warn'],closed:['پرداخت و ثبت شد','ok'],rejected:['رد شد','bad'],cancelled:['لغو شد','']};
const PRI={normal:['عادی',''],urgent:['فوری','warn'],very_urgent:['خیلی فوری','bad']};
const tag=(m,k)=>m[k]?`<span class="tag ${m[k][1]}">${m[k][0]}</span>`:esc(k);
const late=r=>r.due_date&&r.due_date<M.today&&['new','seen','doing'].includes(r.status);

// ---------------------------------------------------------------- ورود و ناوبری
function showLogin(){$('#app').style.display='none';$('#login').style.display='block';$('#lgU').focus()}
async function doLogin(){await run(async()=>{await api('POST','/api/login',{username:val('lgU'),password:val('lgP')});$('#lgP').value='';await boot()})}
$('#lgP').addEventListener('keydown',e=>{if(e.key=='Enter')doLogin()});
async function logout(){await api('POST','/api/logout',{});showLogin()}
async function boot(){
  try{M=await api('GET','/api/meta')}catch(e){return}
  $('#login').style.display='none';$('#app').style.display='block';
  $('#coName').textContent=M.company+' — اتوماسیون اداری';$('#meName').textContent=M.me.full_name+' ('+M.roles[M.me.role]+')';
  document.title='اتوماسیون — '+M.company;
  if(!M.my_roles||!M.p_stages){$('#nav').innerHTML='';$('#view').innerHTML=`<div class="card" style="border-color:var(--bad)"><h1>سرور هنوز نسخه قدیمی (${esc(M.version||'?')}) را اجرا می‌کند</h1>
   <div style="line-height:2.1">فایل صفحه (index.html) نسخه جدید است، ولی برنامه سرور (app.py) هنوز نسخه قبلی است و باید دوباره راه‌اندازی شود.<br>
   ۱. مطمئن شوید app.py جدید در همان پوشه‌ای است که index.html جدید را گذاشتید.<br>
   ۲. روی کامپیوتر سرور فایل <b>4-restart.bat</b> را با «Run as administrator» اجرا کنید (یا کامپیوتر سرور را یک بار ری‌استارت کنید).<br>
   ۳. این صفحه را با Ctrl+F5 دوباره باز کنید.</div></div>`;return}
  if(M.me.must_change)pwModal(true);
  route();refreshCount();
}
const isTop=()=>['admin','manager'].includes(M.me.role); // مدیر سیستم و هیات مدیره: بالاترین سطح
// تب‌های دفتر مرکزی: [کلید، عنوان، مسیر پیش‌فرض، زیرتب‌ها]
const HQ=[['hq-support','پشتیبانی','hq-support',[['hq-support','منتظر خرید'],['purchases','همه درخواست‌های کالا']]],
  ['hq-finance','مالی','hq-finance',[['hq-finance','پرداخت خریدها'],['requests','درخواست‌های مالی'],['request-new','درخواست پرداخت / تنخواه جدید']]],
  ['hq-office','اداری','letters',[['letters','نامه‌ها و بایگانی'],['letter-new','ثبت نامه'],['hq-office','بایگانی درخواست‌های کالا']]]];
const HQ_OF={};HQ.forEach(g=>g[3].forEach(t=>HQ_OF[t[0]]=g));Object.assign(HQ_OF,{letter:HQ[2],'letter-edit':HQ[2],request:HQ[1]});
const navProjects=()=>M.projects.filter(p=>p.code!='HQ'&&(M.broad||M.my_roles.some(r=>r.project_id==p.id)));
function drawNav(cur){
  const a=(k,t,cls,extra)=>`<a href="#/${k}" class="${cls||''} ${cur==k?'on':''}">${t}${extra||''}</a>`;
  let h=M.site_only?'<div class="grp">مکاتبات</div>'+a('letters','نامه‌های من','sub')+a('letter-new','نامه داخلی جدید','sub'):'<div class="grp">دفتر مرکزی</div>'+HQ.map(g=>`<a href="#/${g[2]}" class="sub ${cur==g[0]?'on':''}">${g[1]}</a>`).join('');
  h+='<div class="grp">پروژه‌ها</div>'+navProjects().map(p=>a('project/'+p.id,esc(p.name),'sub')).join('')+(isTop()?'<a class="sub act" onclick="projModal(p=>location=\'#/project/\'+p.id)">+ تعریف پروژه جدید</a>':'');
  h+=a('cartable','کارتابل من','main','<span class="badge" id="cnt" style="display:none"></span>')+'<hr>';
  h+=a('purchase-new','درخواست کالا')+(['admin','manager','secretariat','finance'].includes(M.me.role)?a('reports','گزارش‌ها'):'')+(isTop()?a('admin','مدیریت سامانه'):'')+a('help','راهنما');
  $('#nav').innerHTML=h}
function toggleNav(on){document.body.classList.toggle('navopen',on===undefined?!document.body.classList.contains('navopen'):!!on)}
function subBar(p){const g=HQ_OF[p];if(!g)return'';return `<div class="crumb">دفتر مرکزی › ${g[1]}</div><div class="tabs noprint">${g[3].map(t=>`<a href="#/${t[0]}" class="${t[0]==p?'on':''}">${t[1]}</a>`).join('')}</div>`}
async function refreshCount(){try{const r=await api('GET','/api/counts');['#cnt','#cnt2'].forEach(k=>{const b=$(k);if(b){b.textContent=fa(r.n);b.style.display=r.n?'inline':'none'}});document.title=(r.n?'('+fa(r.n)+') ':'')+'اتوماسیون — '+M.company}catch(e){}}
setInterval(()=>{if(M)refreshCount()},60000);
window.addEventListener('hashchange',route);
async function route(){
  if(!M)return;const h=location.hash.replace(/^#\//,'')||'cartable';const[p,id,sub]=h.split('/');
  toggleNav(0);try{drawNav(p=='project'?'project/'+id:M.site_only?({letter:'letters','letter-edit':'letters'}[p]||p):(HQ_OF[p]||[p])[0])}catch(e){flash('خطا در منو: '+e.message,1)}refreshCount();
  const V={cartable,letters:lettersList,'letter-new':()=>letterForm(),letter:()=>letterView(id),'letter-edit':()=>letterEdit(id),requests:requestsList,'request-new':()=>requestForm(),request:()=>requestView(id),reports,admin,help,
    'hq-support':()=>hqStage('hq_purchase','درخواست‌های کالا منتظر خرید توسط پشتیبانی دفتر مرکزی'),'hq-finance':()=>hqStage('finance_pay','خریدهای انجام‌شده منتظر پرداخت'),'hq-office':()=>hqStage('archive','درخواست‌های کالا منتظر بایگانی',1),
    purchases:()=>purchasesPage(),'purchase-new':()=>purchaseForm(id),purchase:()=>purchaseView(id),project:()=>projectPage(id,sub)};
  const SITE_OK=['letters','letter-new','letter','letter-edit'];
  if(M.site_only&&((HQ_OF[p]&&!SITE_OK.includes(p))||['reports','admin'].includes(p))){location.hash='#/cartable';return}
  $('#view').innerHTML=(M.site_only?'':subBar(p))+'<div id="pg"><div class="mut">در حال بارگذاری…</div></div>';
  await run(async()=>{await (V[p]||cartable)()});window.scrollTo(0,0)}
function pwModal(force){
  const d=document.createElement('div');d.className='modal';d.innerHTML=`<div class="card"><h2>${force?'برای شروع، رمز عبور پیش‌فرض را تغییر دهید':'تغییر رمز عبور'}</h2>
  <div class="grid"><div><label>رمز فعلی</label><input type="password" id="pwO"></div><div><label>رمز جدید (حداقل ۶ کاراکتر)</label><input type="password" id="pwN"></div></div>
  <div class="row" style="margin-top:12px"><button class="btn" id="pwS">ذخیره</button>${force?'':'<button class="btn l" id="pwC">انصراف</button>'}</div></div>`;
  document.body.appendChild(d);
  d.querySelector('#pwS').onclick=()=>run(async()=>{await api('POST','/api/password',{old:val('pwO'),new:val('pwN')});d.remove();M.me.must_change=0;flash('رمز تغییر کرد')});
  if(!force)d.querySelector('#pwC').onclick=()=>d.remove()}

// ---------------------------------------------------------------- اجزای مشترک
function userPicker(id,exclude){const pre=id=='lrTo'&&M.site_only?M.superiors:[];const list=M.site_only?M.users.filter(u=>M.colleagues.includes(u.id)):M.users;
  return `<div class="users" id="${id}">${list.filter(u=>u.id!=exclude).map(u=>`<label><input type="checkbox" value="${u.id}" ${pre.includes(u.id)?'checked':''}> ${esc(u.full_name)} <span class="mut">${esc(u.title)}</span>${pre.includes(u.id)?' <span class="tag pri">بالادست</span>':''}</label>`).join('')}</div>`}
const picked=id=>[...document.querySelectorAll('#'+id+' input:checked')].map(x=>+x.value);
function referForm(pfx,title){return `<div class="grid"><div class="full"><label>${title||'ارجاع به'}</label>${userPicker(pfx+'To',M.me.id)}</div>
  <div><label>نوع اقدام</label><select id="${pfx}Act">${opts(M.actions.map(a=>[a,a]),'اقدام')}</select></div>
  <div><label>مهلت انجام (شمسی)</label><input id="${pfx}Due" value="${todayJ(M.default_due_days)}"></div>
  <div class="full"><label>دستور / توضیح ارجاع</label><textarea id="${pfx}Ins" placeholder="مثلاً: بررسی و تا پایان هفته پاسخ تهیه شود"></textarea></div></div>`}
function referVals(pfx){return{to_ids:picked(pfx+'To'),action:val(pfx+'Act'),instruction:val(pfx+'Ins'),due:toIso(val(pfx+'Due'))}}
const delAtt=(id,name)=>run(async()=>{if(!confirm('پیوست «'+name+'» حذف شود؟'))return;await api('POST',`/api/attachments/${id}/delete`,{});flash('حذف شد');route()});
async function uploadFiles(dt,id,inputId,kind){const f=$('#'+inputId);if(!f||!f.files.length)return;for(const file of f.files){flash('در حال بارگذاری '+file.name);await api('POST',`/api/attach?doc_type=${dt}&doc_id=${id}`,undefined,{name:file.name,data:file,kind})}}
function attachBlock(dt,id,att,canAdd){const kinds=dt=='purchase';return `<div class="card"><h2>پیوست‌ها${kinds?' (پیش‌فاکتور، فاکتور، مشخصات فنی، …)':' و اسکن‌ها'}</h2>${att.length?`<table><tr>${kinds?'<th>نوع</th>':''}<th>فایل</th><th>حجم</th><th>بارگذاری</th><th></th></tr>`+att.map(a=>`<tr>${kinds?`<td>${a.kind?`<span class="tag pri">${esc(a.kind)}</span>`:''}</td>`:''}<td><a href="/files/${a.id}" target="_blank">${esc(a.name)}</a></td><td class="mut">${fa(Math.ceil(a.size/1024))} KB</td><td class="mut">${esc(a.uploader)} — ${jd(a.created_at,1)}</td><td><a href="/files/${a.id}?dl=1">دانلود</a>${a.can_delete?` | <a class="noprint" style="cursor:pointer;color:var(--bad)" onclick="delAtt(${a.id},'${esc(a.name).replace(/'/g,'')}')">حذف</a>`:''}</td></tr>`).join('')+'</table>':'<div class="mut">پیوستی ندارد.</div>'}
  ${canAdd===false?(kinds?'<div class="mut noprint" style="margin-top:6px">پیوست و حذف پیوست فقط وقتی ممکن است که درخواست در کارتابل شما باشد.</div>':''):`<div class="row noprint" style="margin-top:10px">${kinds?`<div>${kindSel('attK')}</div>`:''}<div style="flex:1"><input type="file" id="attF" multiple accept=".pdf,.jpg,.jpeg,.png,.heic,.tif,.tiff,.doc,.docx,.xls,.xlsx,.zip,.dwg"></div><button class="btn l" onclick="run(async()=>{await uploadFiles('${dt}',${id},'attF',val('attK'));flash('بارگذاری شد');route()})">افزودن پیوست</button></div>`}</div>`}
function flowBlock(dt,id,refs){
  const mine=refs.filter(r=>r.to_id==M.me.id&&['new','seen','doing'].includes(r.status));
  let h=`<div class="card"><h2>گردش و ارجاع‌ها</h2>`;
  const hold=refs.filter(r=>['new','seen','doing'].includes(r.status));
  h+=`<div style="margin-bottom:8px"><b>اکنون در دست: </b>${hold.length?hold.map(r=>`<span class="tag ${late(r)?'bad':'pri'}">${esc(r.to_name)} — ${esc(r.action)}${r.due_date?' تا '+jd(r.due_date):''}</span>`).join(' '):'<span class="mut">ارجاع بازی ندارد</span>'}</div>`;
  h+=refs.length?`<table><tr><th>#</th><th>از</th><th>به</th><th>اقدام</th><th>دستور</th><th>تاریخ ارجاع</th><th>مهلت</th><th>وضعیت</th><th>نتیجه / پاسخ</th></tr>${refs.map((r,i)=>`<tr class="${late(r)?'late':''}"><td>${fa(i+1)}</td><td>${esc(r.from_name)}</td><td>${esc(r.to_name)}</td><td>${esc(r.action)}</td><td>${esc(r.instruction)}</td><td class="mut">${jd(r.created_at,1)}</td><td>${jd(r.due_date)}</td><td>${tag(REF_ST,r.status)}${r.from_id==M.me.id&&['new','seen','doing'].includes(r.status)?` <a class="noprint" style="cursor:pointer" onclick="cancelRef(${r.id})">لغو</a>`:''}</td><td>${esc(r.reply)}${r.done_at?' <span class="mut">('+jd(r.done_at,1)+')</span>':''}</td></tr>`).join('')}</table>`:'<div class="mut">هنوز ارجاعی نشده است.</div>';
  h+='</div>';
  if(mine.length){const r=mine[0];h+=`<div class="card noprint" style="border-color:var(--warn)"><h2>اقدام شما — ${esc(r.action)} <span class="mut">(از ${esc(r.from_name)}${r.instruction?': '+esc(r.instruction):''})</span></h2>
    <div class="tabs"><a class="on" data-t="a">پاسخ / انجام شد</a><a data-t="b">ارجاع به دیگری</a></div>
    <div data-p="a"><label>شرح اقدام انجام‌شده یا پاسخ</label><textarea id="myRep"></textarea><div class="row" style="margin-top:8px">
      <button class="btn ok" onclick="refSt(${r.id},'done')">انجام شد</button>${r.status!='doing'?`<button class="btn l" onclick="refSt(${r.id},'doing')">در حال اقدام</button>`:''}<button class="btn bad" onclick="refSt(${r.id},'returned')">برگشت به ارجاع‌دهنده</button></div></div>
    <div data-p="b" style="display:none">${referForm('fw','ارجاع به')}<div class="row" style="margin-top:8px"><button class="btn" onclick="doRefer('${dt}',${id},'fw',${r.id})">ارجاع</button></div></div></div>`}
  h+=`<div class="card noprint"><details><summary style="cursor:pointer;font-weight:bold">ارجاع جدید (رونوشت، نظرخواهی، پیگیری)</summary><div style="margin-top:10px">${referForm('nr')}<div class="row" style="margin-top:8px"><button class="btn" onclick="doRefer('${dt}',${id},'nr')">ثبت ارجاع</button></div></div></details></div>`;
  return h}
function bindTabs(){document.querySelectorAll('.tabs').forEach(t=>t.querySelectorAll('a[data-t]').forEach(a=>a.onclick=()=>{t.querySelectorAll('a').forEach(x=>x.classList.toggle('on',x==a));const box=t.parentElement;box.querySelectorAll('[data-p]').forEach(p=>p.style.display=p.dataset.p==a.dataset.t?'':'none')}))}
function logBlock(lg){return `<div class="card"><details><summary style="cursor:pointer;font-weight:bold">سابقه کامل رویدادها (${fa(lg.length)})</summary><table style="margin-top:8px">${lg.map(l=>`<tr><td class="mut" style="width:130px">${jd(l.at,1)}</td><td>${esc(l.user_name)}</td><td>${esc(l.event)}</td><td>${esc(l.detail)}</td></tr>`).join('')}</table></details></div>`}
const refSt=(id,st)=>run(async()=>{await api('POST',`/api/referrals/${id}/status`,{status:st,reply:val('myRep')});flash('ثبت شد');route()});
const cancelRef=id=>run(async()=>{if(!confirm('این ارجاع لغو شود؟'))return;await api('POST',`/api/referrals/${id}/status`,{status:'cancel'});route()});
const doRefer=(dt,id,pfx,parent)=>run(async()=>{const v=referVals(pfx);if(!v.to_ids.length)throw new Error('گیرنده را انتخاب کنید');await api('POST','/api/refer',Object.assign(v,{doc_type:dt,doc_id:id,parent_id:parent||null,reply:parent?val('myRep'):''}));flash('ارجاع شد');route()});
const docLink=r=>`#/${r.doc_type}/${r.doc_id}`;

async function cartable(){
  const d=await api('GET','/api/cartable');M.today=d.today;
  const sec=[['in','ارجاع‌شده به من',d.inbox.length],['pur','درخواست‌های کالا در کارتابل من',d.pur_held.length],['ap','منتظر تأیید من',d.approvals.length],['sent','پیگیری ارجاع‌های من',d.sent.length],['mine','درخواست‌های من',d.mine.length+d.pur_mine.length]];
  if(M.me.role=='finance'||isTop())sec.push(['pay','مالی: پرداخت و سند سپیدار',d.pay.length]);
  if(M.me.role=='secretariat'||isTop())sec.push(['desk','دبیرخانه: نامه‌های بدون ارجاع',d.desk.length]);
  let h=`<h1>کارتابل ${esc(M.me.full_name)}</h1><div class="tabs">${sec.map((s,i)=>`<a data-t="${s[0]}" class="${i?'':'on'}">${s[1]} (${fa(s[2])})</a>`).join('')}</div>`;
  const tbl=(head,body,empty)=>body.length?`<table><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr>${body.join('')}</table>`:`<div class="card mut">${empty}</div>`;
  h+=`<div data-p="in">${tbl(['سند','از','اقدام','دستور','تاریخ ارجاع','مهلت','وضعیت'],d.inbox.map(r=>`<tr class="cl ${late(r)?'late':''}" onclick="location='${docLink(r)}'"><td>${r.doc_type=='request'?'<span class="tag">مالی</span> ':r.doc_type=='purchase'?'<span class="tag">کالا</span> ':''}${r.priority&&r.priority!='normal'?tag(PRI,r.priority)+' ':''}${esc(fa(r.doc_label))}</td><td>${esc(r.from_name)}</td><td>${esc(r.action)}</td><td>${esc(r.instruction)}</td><td class="mut">${jd(r.created_at,1)}</td><td>${jd(r.due_date)}${late(r)?' <span class="tag bad">گذشته</span>':''}</td><td>${tag(REF_ST,r.status)}</td></tr>`),'کاری در کارتابل شما نیست.')}</div>`;
  h+=`<div data-p="pur" style="display:none">${d.pur_held.length?purTable(d.pur_held,1):'<div class="card mut">درخواست کالایی در کارتابل شما نیست.</div>'}</div>`;
  h+=`<div data-p="ap" style="display:none">${tbl(['شماره','عنوان','نوع','پروژه','درخواست‌کننده','مبلغ (ریال)','مرحله'],d.approvals.map(r=>`<tr class="cl" onclick="location='#/request/${r.request_id}'"><td>${fa(r.number)}</td><td>${esc(r.title)}</td><td>${esc(r.kind)}</td><td>${esc(r.project||'')}</td><td>${esc(r.requester)}</td><td>${money(r.amount)}</td><td>${esc(r.label)}</td></tr>`),'درخواستی منتظر تأیید شما نیست.')}</div>`;
  h+=`<div data-p="sent" style="display:none">${tbl(['سند','به','اقدام','تاریخ ارجاع','مهلت','وضعیت'],d.sent.map(r=>`<tr class="cl ${late(r)?'late':''}" onclick="location='${docLink(r)}'"><td>${esc(fa(r.doc_label))}</td><td>${esc(r.to_name)}</td><td>${esc(r.action)}</td><td class="mut">${jd(r.created_at,1)}</td><td>${jd(r.due_date)}</td><td>${tag(REF_ST,r.status)}</td></tr>`),'ارجاع باز ندارید.')}</div>`;
  h+=`<div data-p="mine" style="display:none">${d.pur_mine.length?'<h2>درخواست‌های کالای من</h2>'+purTable(d.pur_mine,1):''}${d.mine.length||!d.pur_mine.length?'<h2>درخواست‌های مالی من</h2>':''}${tbl(['شماره','عنوان','پروژه','مبلغ (ریال)','وضعیت'],d.mine.map(r=>`<tr class="cl" onclick="location='#/request/${r.id}'"><td>${fa(r.number)}</td><td>${esc(r.title)}</td><td>${esc(r.project||'')}</td><td>${money(r.amount)}</td><td>${tag(R_ST,r.status)}</td></tr>`),'درخواست مالی باز ندارید.')}</div>`;
  h+=`<div data-p="pay" style="display:none">${tbl(['شماره','عنوان','ذینفع','پروژه','مبلغ تأییدشده (ریال)','وضعیت'],d.pay.map(r=>`<tr class="cl" onclick="location='#/request/${r.id}'"><td>${fa(r.number)}</td><td>${esc(r.title)}</td><td>${esc(r.payee)}</td><td>${esc(r.project||'')}</td><td>${money(r.amount)}</td><td>${tag(R_ST,r.status)}</td></tr>`),'موردی برای پرداخت نیست.')}</div>`;
  h+=`<div data-p="desk" style="display:none">${tbl(['شماره','موضوع','طرف مکاتبه','تاریخ ثبت'],d.desk.map(r=>`<tr class="cl" onclick="location='#/letter/${r.id}'"><td>${fa(r.number)}</td><td>${esc(r.subject)}</td><td>${esc(r.counterpart)}</td><td class="mut">${jd(r.created_at,1)}</td></tr>`),'همه نامه‌های جاری ارجاع شده‌اند.')}</div>`;
  $('#pg').innerHTML=h;bindTabs()}

function newProj(sel){if(sel.value!='__new')return;sel.value='';projModal(p=>{sel.innerHTML=projOpts(p.id,true)})}

  <div class="row" style="margin-top:12px"><button class="btn" id="npS">ثبت پروژه</button><button class="btn l" id="npX">انصراف</button></div></div>`;

async function reloadMeta(){M=Object.assign(M,await api('GET','/api/meta'))}
async function lettersList(){

   <div style="flex:2"><label>جستجو (موضوع، شماره، طرف مکاتبه، کد بایگانی)</label><input id="fQ" value="${esc(f.q||'')}"></div>
   <div><label>نوع</label><select id="fK">${opts(Object.entries(M.letter_kinds),f.kind,'همه')}</select></div>
   <div><label>وضعیت</label><select id="fS">${opts([['open','جاری'],['archived','بایگانی']],f.status,'همه')}</select></div>
   <div><label>پروژه</label><select id="fP">${projOpts(f.project_id)}</select></div>
   <div><label>در دست</label><select id="fH">${opts(M.users.map(u=>[u.id,u.full_name]),f.holder,'همه')}</select></div>
   <div><label>از تاریخ</label><input id="fF" value="${esc(f.fromJ||'')}" placeholder="۱۴۰۵/۰۱/۰۱"></div>

  const qs=new URLSearchParams(Object.entries({q:f.q,kind:f.kind,status:f.status,project_id:f.project_id,holder:f.holder,from:f.from,to:f.to,overdue:f.overdue?1:''}).filter(x=>x[1]));
  lettersList.qs=qs.toString();
  const rs=await api('GET','/api/letters?'+qs);

function letFilter(){run(async()=>{lettersList.f={q:val('fQ'),kind:val('fK'),status:val('fS'),project_id:val('fP'),holder:val('fH'),fromJ:val('fF'),toJ:val('fT'),from:toIso(val('fF')),to:toIso(val('fT')),overdue:$('#fO').checked};await lettersList()})}
function letCsv(){location='/api/letters.csv?'+(lettersList.qs||'')}

  return `<div class="grid">

function purChain(P,flow){
  const seen=new Set(flow.map(f=>f.stage));let cur=PUR_SEQ.indexOf(P.stage);if(P.status=='closed')cur=PUR_SEQ.length;
  const seq=PUR_SEQ.filter(k=>!(k=='tech_review'&&P.category!='main'&&!seen.has(k)));
  return `<div class="chain">${seq.map((k,i)=>{const j=PUR_SEQ.indexOf(k);let c='';if(P.status=='delivered')c=j<=2?'approved':'skipped';else if(P.status=='open')c=j<cur?(seen.has(k)?'approved':'skipped'):j==cur?'pending':'';else if(P.status=='closed')c='approved';else c=seen.has(k)?'approved':'skipped';
    return `<div class="st ${c}">${fa(i+1)}. ${M.p_stages[k]}</div>`}).join('<span>←</span>')}${P.status=='delivered'?'<span>←</span><div class="st approved"><b>تحویل از انبار</b></div>':''}${P.status=='cancelled'?'<span>←</span><div class="st rejected"><b>لغو و بایگانی</b></div>':''}</div>`}
function verDiff(a,b){ // تفاوت اقلام دو نسخه
  const key=it=>it.title;const A=new Map((a.items||[]).map(i=>[key(i),i])),B=new Map((b.items||[]).map(i=>[key(i),i]));const out=[];
  for(const [k,i] of B){const o=A.get(k);if(!o)out.push(`<span class="tag ok">+ ${esc(k)} (${esc(fa(i.qty))} ${esc(i.unit)})</span>`);else{const ch=['qty','unit','spec','note'].filter(f=>(o[f]||'')!=(i[f]||''));if(ch.length)out.push(`<span class="tag warn">${esc(k)}: ${ch.map(f=>`${{qty:'مقدار',unit:'واحد',spec:'مشخصات',note:'توضیحات'}[f]} ${esc(fa(o[f]||'—'))} ← ${esc(fa(i[f]||'—'))}`).join('، ')}</span>`)}}
  for(const [k] of A)if(!B.has(k))out.push(`<span class="tag bad">− ${esc(k)}</span>`);
  const hd={purpose:'جهت استفاده',warehouse:'انبار',category:'دسته',urgency:'فوریت',need_date:'تاریخ نیاز',unit:'واحد درخواست‌کننده'};
  for(const f in hd)if((a[f]||'')!=(b[f]||''))out.push(`<span class="tag">${hd[f]} تغییر کرد</span>`);
  return out.join(' ')||'<span class="mut">بدون تغییر در اقلام</span>'}
const hrs=(a,b)=>{const h=(new Date(b.replace(' ','T'))-new Date(a.replace(' ','T')))/36e5;return h<1?fa(Math.round(h*60))+' دقیقه':h<48?fa(h.toFixed(1))+' ساعت':fa((h/24).toFixed(1))+' روز'};

// ---------------------------------------------------------------- راهنما
function help(){$('#pg').innerHTML=`<h1>راهنمای کوتاه</h1><div class="card" style="line-height:2.1">
<b>قاعده اصلی:</b> هیچ نامه یا درخواستی بیرون از سامانه دست‌به‌دست نمی‌شود. کاغذ فقط برای بایگانی فیزیکی است و هر سند باید در هر لحظه در دست یک نفر مشخص باشد.<br>
<b>دبیرخانه (منشی):</b> نامه رسیده را اسکن کنید ← «ثبت نامه» ← مشخصات و فایل اسکن را وارد کنید ← همان‌جا به فرد مسئول ارجاع دهید (یا به مدیرعامل برای دستور). شماره ثبت را روی اصل نامه بنویسید.<br>
<b>مدارک کارگاه‌ها که در تلگرام/واتساپ می‌رسد:</b> اگر نیاز به اقدام دفتر دارد، دبیرخانه آن را با نحوه دریافت «تلگرام/واتساپ کارگاه» ثبت و ارجاع می‌کند.<br>
<b>هر کاربر:</b> روزی دو بار «کارتابل من» را ببیند. روی هر کار: «در حال اقدام»، «انجام شد» (با شرح)، «برگشت» (با علت) یا «ارجاع به دیگری». ردیف‌های قرمز مهلتشان گذشته است.<br>
<b>ارجاع‌دهنده:</b> در زبانه «پیگیری ارجاع‌های من» می‌بیند کار دست چه کسی مانده؛ دیگر نیازی به پیگیری تلفنی نیست.<br>
<b>درخواست کالا:</b> یکی از ارکان پروژه فرم را پر و ارسال می‌کند ← تأیید رئیس واحد (معاون فنی، معاون اجرایی یا سرپرست کارگاه؛ اگر خود یکی از این‌ها ثبت کند، همان ثبت تأیید است) ← استعلام انبار کارگاه (اگر موجود بود، حواله خروج و پایان) ← معاون فنی (فقط مصالح اصلی) ← سرپرست کارگاه ← مدیر پروژه ← پشتیبانی دفتر مرکزی (خرید) ← مالی (پرداخت) ← منشی (بایگانی). درخواستی که معاون فنی ثبت کند، رونوشتش به معاون اجرایی می‌رود. درخواست‌کننده می‌تواند اول «پیش‌نویس» ذخیره کند و بعد ارسال کند. تا مرحله مدیر پروژه (خود مدیر پروژه هم)، فقط کسی که درخواست اکنون در کارتابل اوست می‌تواند آن را ویرایش کند (با ثبت نسخه جدید؛ نسخه‌های قبلی دست‌نخورده می‌مانند) یا با ذکر علت لغو کند؛ درخواست لغوشده در بایگانی می‌ماند. پیش‌فاکتور، فاکتور و مشخصات فنی را کسی که درخواست در کارتابل اوست با انتخاب نوع پیوست می‌کند؛ هر کس فقط پیوست خودش را، و فقط تا وقتی درخواست را به نفر بعد نفرستاده، می‌تواند حذف کند. پیوست‌های هر درخواست در پوشه جداگانه‌ای به شماره همان درخواست نگه داشته می‌شوند (data\files\درخواست کالا).<br>
<b>چارت کارگاه:</b> مهندسان اجرایی زیر نظر معاون اجرایی و مهندسان دفتر فنی زیر نظر معاون فنی هستند؛ پشتیبانی و انبار زیر نظر سرپرست کارگاه، معاونان زیر نظر سرپرست کارگاه و او زیر نظر مدیر پروژه. درخواست کالای هر نفر را بالادست مستقیمش تأیید می‌کند. مهندسان فقط درخواست‌های واحد خودشان را می‌بینند. کارکنان کارگاه نامه داخلی را فقط برای همکاران پروژه می‌فرستند و بالادستشان به‌طور پیش‌فرض گیرنده است.<br>
<b>ارکان پروژه:</b> هیات مدیره و مدیر سیستم در صفحه هر پروژه (بخش پروژه‌ها) مدیر پروژه، سرپرست کارگاه، معاونان، پشتیبانی و انبار را تعیین می‌کنند.<br>
<b>درخواست مالی (تنخواه، پرداخت):</b> «دفتر مرکزی › مالی › درخواست پرداخت / تنخواه جدید» ← پیش‌فاکتور را پیوست کنید ← مسیر تأیید خودکار ساخته می‌شود. تأییدکننده‌ها در «منتظر تأیید من» تأیید/رد/برگشت می‌زنند. مالی پس از پرداخت، شماره سند سپیدار را ثبت می‌کند.<br>
